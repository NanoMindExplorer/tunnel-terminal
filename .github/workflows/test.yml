name: Unit Tests

on:
  push:
    branches: [ main, 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.1.8937393 cmake;3.22.1 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (full flavor)
        run: ./gradlew testFullDebugUnitTest --continue --no-daemon

      - name: Run unit tests (playstore flavor)
        run: ./gradlew testPlaystoreDebugUnitTest --continue --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 30

      - name: Upload test HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-html
          path: app/build/reports/tests/testFullDebugUnitTest/
          retention-days: 30
