name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Full Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.1.8937393 cmake;3.22.1'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Obtain proot binary from Termux package
        run: |
          mkdir -p app/src/main/assets/proot/lib
          echo "Downloading proot .deb from Termux packages..."
          DEB_URL=$(curl -s "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/" | \
            grep -oE 'proot_[0-9][^"]*_aarch64.deb' | sort -V | tail -1)
          if [ -z "$DEB_URL" ]; then
            echo "ERROR: Could not find proot aarch64 .deb"
            exit 1
          fi
          echo "Found: $DEB_URL"
          curl -L -o proot.deb "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/$DEB_URL"
          ar x proot.deb
          tar -xf data.tar.xz
          cp ./data/data/com.termux/files/usr/bin/proot app/src/main/assets/proot/proot
          chmod 755 app/src/main/assets/proot/proot
          cp ./data/data/com.termux/files/usr/lib/libtalloc.so.2 app/src/main/assets/proot/lib/ 2>/dev/null || true
          cp ./data/data/com.termux/files/usr/lib/libandroid-shmem.so app/src/main/assets/proot/lib/ 2>/dev/null || true
          file app/src/main/assets/proot/proot
          ls -la app/src/main/assets/proot/lib/

      - name: Build Full Debug APK
        run: ./gradlew assembleFullDebug --no-daemon

      - name: Verify APK exists
        run: |
          echo "=== Looking for APK ==="
          find app/build/outputs/apk -name "*.apk" -type f
          echo "=== APK details ==="
          ls -la app/build/outputs/apk/full/debug/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-terminal-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
          retention-days: 30
          if-no-files-found: error
