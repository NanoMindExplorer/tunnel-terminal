name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Full Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.1.8937393 cmake;3.22.1'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Obtain proot binary (pinned, full flavor)
        run: |
          chmod +x scripts/obtain-proot.sh
          ./scripts/obtain-proot.sh app/src/full/assets/proot

      - name: Build Full Debug APK
        run: ./gradlew assembleFullDebug --no-daemon

      - name: Verify APK exists
        run: |
          echo "=== Looking for APK ==="
          find app/build/outputs/apk -name "*.apk" -type f
          echo "=== APK details ==="
          ls -la app/build/outputs/apk/full/debug/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-terminal-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
          retention-days: 30
          if-no-files-found: error
