org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# v8.5.0 fix (L4): Enable Gradle build cache + configuration-cache + parallel.
# Build cache: reuse outputs from previous builds (local + remote).
# Configuration-cache: cache configuration phase (faster subsequent builds).
# Parallel: build modules in parallel (helps if multi-module).
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# v8.5.0 fix (L4): Kotlin incremental compilation (default true, but explicit).
kotlin.incremental=true
